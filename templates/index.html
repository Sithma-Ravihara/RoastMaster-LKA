<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sithma AI Roast | Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }
        .gradient-text {
            background: linear-gradient(to right, #ff416c, #ff4b2b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .loader {
            border: 4px solid rgba(255,255,255,0.1);
            border-left-color: #ff416c;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-4">
    <div class="glass w-full max-w-md p-8 animate__animated animate__fadeInUp">
        <h1 class="text-4xl font-black text-center mb-2 gradient-text">SITHMA AI</h1>
        <p class="text-gray-400 text-center mb-8 text-sm">ලංකාවේ සැරම AI Roast එක</p>

        <form id="roastForm" class="space-y-6">
            <div class="relative border-2 border-dashed border-gray-500 rounded-xl p-6 text-center hover:border-pink-500 transition-all">
                <input type="file" name="photo" id="photo" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" accept="image/*" required>
                <div id="previewText">
                    <p class="text-3xl mb-2">📸</p>
                    <p class="text-sm text-gray-300">පින්තූරයක් තෝරන්න</p>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-pink-600 to-red-600 py-4 rounded-xl font-bold text-lg hover:scale-105 transition-transform active:scale-95 shadow-lg">
                ROAST ME! 🔥
            </button>
        </form>

        <div id="loading" class="hidden flex flex-col items-center mt-8 space-y-4">
            <div class="loader"></div>
            <p class="text-pink-400 animate-pulse">AI එක ඔයාගේ රූපේ විචාරය කරනවා...</p>
        </div>

        <div id="resultBox" class="hidden mt-8 p-6 bg-black/40 rounded-2xl border border-pink-500/30 animate__animated animate__zoomIn">
            <h3 class="text-pink-500 font-bold mb-2">AI කීව කතාව:</h3>
            <p id="roastResult" class="text-lg leading-relaxed italic text-gray-200"></p>
            <button onclick="location.reload()" class="mt-4 text-xs text-gray-500 underline">තව එකක් කරමු</button>
        </div>
    </div>

    <script>
        const form = document.getElementById('roastForm');
        form.onsubmit = async (e) => {
            e.preventDefault();
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('resultBox').classList.add('hidden');

            const formData = new FormData(form);
            const response = await fetch('/roast', { method: 'POST', body: formData });
            const data = await response.json();

            document.getElementById('loading').classList.add('hidden');
            document.getElementById('submitBtn').disabled = false;

            if (data.roast) {
                document.getElementById('resultBox').classList.remove('hidden');
                document.getElementById('roastResult').innerText = data.roast;
            } else {
                alert("AI busy. Try again!");
            }
        };
    </script>
</body>
</html>
